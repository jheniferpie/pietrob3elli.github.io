<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Data QA Demo - Rheology Dashboard</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#0f172a;color:#e5e7eb;padding:20px}
  .panel{background:#0b1220;padding:16px;border-radius:8px;border:1px solid rgba(255,255,255,.04)}
  input, button{padding:8px;border-radius:6px}
  table{width:100%;border-collapse:collapse;margin-top:12px}
  th,td{padding:6px;border:1px solid rgba(255,255,255,.04)}
  .muted{color:#94a3b8}
</style>
</head>
<body>
  <div class="panel">
    <h2>Data QA Demo</h2>
    <p class="muted">Carregue um CSV (com header). O parser detectará colunas numéricas, valores faltantes e outliers (IQR).</p>
    <input id="file" type="file" accept=".csv,.txt" />
    <button id="btn-export" style="margin-left:8px">Exportar CSV Limpo</button>
    <div id="report" style="margin-top:12px"></div>
    <div id="table-wrap"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="/scripts/data_qa.js"></script>
<script>
  const fileInput = document.getElementById('file');
  const reportDiv = document.getElementById('report');
  const tableWrap = document.getElementById('table-wrap');
  let current = {headers: [], rows: []};
  fileInput.addEventListener('change', (e)=>{
    const f = e.target.files[0];
    if(!f) return;
    Papa.parse(f, { header:true, skipEmptyLines:true, complete: (res)=>{
      current.headers = res.meta.fields || (res.data.length>0?Object.keys(res.data[0]):[]);
      current.rows = res.data;
      showReport();
      showTable(current.headers, current.rows);
    }});
  });

  function showReport(){
    if(!current.rows || current.rows.length===0) return;
    const rpt = window.DataQA.generateQAReport(current.headers, current.rows);
    let html = '<h3>Resumo QA</h3>';
    html += '<p>Total de linhas: '+rpt.totalRows+'</p>';
    html += '<p>Colunas numéricas detectadas: '+rpt.numericColumns.join(', ')+'</p>';
    html += '<h4>Valores faltantes por coluna</h4><ul>';
    Object.entries(rpt.missingPerColumn).forEach(([k,v])=> html += '<li>'+k+': '+v+'</li>');
    html += '</ul>';
    html += '<h4>Outliers (IQR)</h4>';
    Object.entries(rpt.outlierStats).forEach(([k,v])=>{
      if(v.outliers && v.outliers.length>0) html += '<p><b>'+k+'</b>: '+v.outliers.length+' outliers (limites: '+v.lower+' → '+v.upper+')</p>';
    });
    reportDiv.innerHTML = html;

    // add quick actions
    const actions = document.createElement('div');
    actions.style.marginTop = '8px';
    const btnRemoveNaN = document.createElement('button'); btnRemoveNaN.textContent = 'Remover linhas com campos numéricos inválidos';
    btnRemoveNaN.addEventListener('click', ()=>{
      const valid = window.DataQA.filterRowsByValidity(current.headers, current.rows, { requiredNumeric: rpt.numericColumns });
      current.rows = valid;
      showTable(current.headers, current.rows);
      showReport();
    });
    const btnRemoveOutliers = document.createElement('button'); btnRemoveOutliers.textContent = 'Remover outliers (IQR)';
    btnRemoveOutliers.style.marginLeft = '8px';
    btnRemoveOutliers.addEventListener('click', ()=>{
      // build thresholds from outlierStats
      const thr = {};
      Object.entries(rpt.outlierStats).forEach(([k,v])=>{ if(v.count>0){ thr[k] = { lower: v.lower, upper: v.upper }; }});
      current.rows = window.DataQA.filterRowsByValidity(current.headers, current.rows, { outlierThresholds: thr, requiredNumeric: rpt.numericColumns });
      showTable(current.headers, current.rows);
      showReport();
    });
    actions.appendChild(btnRemoveNaN); actions.appendChild(btnRemoveOutliers);
    reportDiv.appendChild(actions);
  }

  function showTable(headers, rows){
    let html = '<table><thead><tr>' + headers.map(h=>'<th>'+h+'</th>').join('') + '</tr></thead><tbody>';
    rows.forEach(r=>{
      html += '<tr>' + headers.map(h=>'<td>'+ (r[h]===undefined? '': r[h]) + '</td>').join('') + '</tr>';
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
  }

  document.getElementById('btn-export').addEventListener('click', ()=>{
    if(!current.rows || current.rows.length===0) return alert('Nenhum dado para exportar');
    const csv = window.DataQA.exportCSV(current.headers, current.rows);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'processed.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
